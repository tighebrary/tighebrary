<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Build-A-Site - Alex Tighe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <!-- Bootstrap's CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom CSS-->
    <link rel="stylesheet" href="css/style.css">
    <style>
      .code-container {
        position: relative;
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 20px;        margin-top: 20px;
        margin-bottom: 30px;
      }
      .copy-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 5px 10px;
        font-size: 0.8rem;
      }
      pre {
        margin-bottom: 0;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <h1 class="mb-4">Code Snippets</h1>
          <p class="lead mb-5">Useful snippets for your web projects. Click the button to copy the code to your clipboard.</p>

          <!-- Snippet 1 -->
          <div class="code-container">
            <button class="btn btn-outline-secondary copy-btn">Copy</button>
            <pre><code>&lt;!-- Example Bootstrap Card --&gt;
&lt;div class="card"&gt;
  &lt;div class="card-body"&gt;
    This is some text within a card body.
  &lt;/div&gt;
&lt;/div&gt;</code></pre>
          </div>

          <div class="text-center mt-4">
            <a href="index.html" class="text-decoration-none">Back to Home</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap's JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
      // Copy to clipboard functionality
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const code = btn.nextElementSibling.innerText;
          navigator.clipboard.writeText(code).then(() => {
            const originalText = btn.innerText;
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = originalText, 2000);
          }).catch(err => {
            console.error('Failed to copy: ', err);
          });
        });
      });
    </script>
  </body>
</html>
